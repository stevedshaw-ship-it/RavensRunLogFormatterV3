name: Build Windows EXE
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install reportlab Pillow pyinstaller
      - run: pyinstaller xp_formatter.spec
      - uses: actions/upload-artifact@v4
        with:
          name: XPressionAsRunFormatter
          path: dist/XPressionAsRunFormatter.exe
